# Put the two zones in the http {} block (e.g. /etc/nginx/conf.d/quiz_ratelimit.conf), the locations in your server {} block.
limit_req_zone $binary_remote_addr zone=quiz_auth:10m rate=30r/m;   # login, register, otp, guest
limit_req_zone $binary_remote_addr zone=quiz_api:10m  rate=300r/m;  # everything else under /api/
limit_req_status 429;

location ^~ /api/auth/ {
    limit_req zone=quiz_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:3007;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # the app rate-limits on this header
}
location ^~ /api/ {
    limit_req zone=quiz_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:3007;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
